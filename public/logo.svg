<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Circle (1:1 Circle Container) with Black Background -->
  <circle cx="50" cy="50" r="46" fill="#000000" stroke="#222222" stroke-width="1.5" />

  <!-- Minimalist Symbol: Interlocking geometric pages/ribbons in Pure White -->
  <g transform="translate(50, 48) scale(0.9)">
    <!-- Left Wing / Page -->
    <path
      d="M -18,10 C -18,0 -8,-10 0,-15 C -8,-5 -8,5 -8,15 C -8,22 -14,25 -18,25 Z"
      fill="#ffffff"
      opacity="0.8"
    />
    
    <!-- Right Wing / Page -->
    <path
      d="M 18,10 C 18,0 8,-10 0,-15 C 8,-5 8,5 8,15 C 8,22 14,25 18,25 Z"
      fill="#ffffff"
      opacity="0.8"
    />

    <!-- Top Diamond (Graduation cap top) -->
    <path
      d="M 0,-28 L 8,-20 L 0,-12 L -8,-20 Z"
      fill="#ffffff"
      opacity="1"
    />

    <!-- Center Glow Dot -->
    <circle cx="0" cy="5" r="3" fill="#ffffff" opacity="1" />
  </g>
</svg>
